name: Check package

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The validators read files from the tracked upstream tag. Fetch it from
      # upstream directly; its tree holds workflow files, so it must not be
      # pushed to this repo by the bot token.
      - name: Fetch upstream tags
        run: git fetch https://github.com/blader/humanizer.git '+refs/tags/v*:refs/tags/v*'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check package files
        run: python3 scripts/validate-package.py
      - name: Check rewrite diagnostics
        run: python3 scripts/test-check-rewrite.py
      - name: Check Korean localization
        run: python3 scripts/validate-localization.py
      - name: Check Claude Desktop archive
        run: python3 scripts/build-skill-zip.py "${RUNNER_TEMP}/humanizer-ko-skill.zip"
      - name: Check skill discovery
        run: npx --yes skills@1.5.20 add . --list
      - name: Check Claude marketplace
        run: |
          npm install --global @anthropic-ai/claude-code
          claude plugin validate .
