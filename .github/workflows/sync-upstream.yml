name: Propose upstream update

# Upstream owns the English patterns; this fork owns the Korean skill.
# Instead of merging upstream history, rebuild only the English pattern
# reference from the newest upstream release and open a draft PR.

on:
  schedule:
    - cron: "23 1 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild the English reference from the latest upstream release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch https://github.com/blader/humanizer.git '+refs/tags/v*:refs/tags/v*'

          latest=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          current=$(tr -d '\r\n' < .upstream-version)

          if [[ -z "$latest" ]]; then
            echo "No stable upstream tag found"
            exit 1
          fi
          if [[ "$latest" == "$current" ]]; then
            echo "Already following $current"
            exit 0
          fi

          branch="bot/sync-upstream-${latest#v}"
          if [[ $(gh pr list --head "$branch" --state open --json number --jq 'length') != "0" ]]; then
            echo "An update pull request already exists for $latest"
            exit 0
          fi

          report_failure() {
            title="Upstream sync failed: $latest"
            if [[ $(gh issue list --state open --search "$title in:title" --json number --jq 'length') == "0" ]]; then
              gh issue create --title "$title" --body "$1 See the workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            fi
            exit 1
          }

          git switch -c "$branch"
          python3 scripts/sync-english-patterns.py --tag "$latest" \
            || report_failure "Could not extract English patterns from $latest. Upstream may have changed its SKILL.md layout; update scripts/sync-english-patterns.py."
          python3 scripts/validate-package.py \
            && python3 scripts/validate-localization.py \
            && python3 scripts/test-check-rewrite.py \
            && python3 scripts/build-skill-zip.py "$RUNNER_TEMP/humanizer-ko-skill.zip" \
            || report_failure "Checks failed after rebuilding English patterns from $latest."

          git add .upstream-version LICENSE README.md \
            references/english-patterns.md \
            skills/humanizer-ko/references/english-patterns.md
          git commit -m "chore: follow upstream $latest English patterns"

          # The validators read files from the upstream tag, so CI needs it too.
          git push origin "refs/tags/$latest"
          git push --force-with-lease --set-upstream origin "$branch"

          gh pr create \
            --draft \
            --base main \
            --head "$branch" \
            --title "Follow upstream $latest English patterns" \
            --body "Rebuilt \`references/english-patterns.md\` from upstream [$latest](https://github.com/blader/humanizer/releases/tag/$latest) (was $current). Korean files were not touched. Checks passed.

          Before merging:
          - Read the upstream release notes and the English pattern diff.
          - Check that no new upstream section adds workflow or output rules that conflict with \`SKILL.md\`.
          - Decide whether this needs a new \`ko-\` version and a README history note."
